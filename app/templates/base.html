<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Каталог{% endblock %} · Управление товарами</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <aside class="sidebar">
    <a class="brand" href="/products"><span>Каталог<span class="brand-caption">Панель управления</span></span></a>
    <div class="nav-label">РАЗДЕЛЫ</div>
    <nav aria-label="Основное меню">
      <a href="/products" {% if active == 'products' %}aria-current="page"{% endif %}>Товары</a>
      <a href="/categories" {% if active == 'categories' %}aria-current="page"{% endif %}>Категории</a>
    </nav>
    <div class="sidebar-note">Локальный каталог<p>Изменения сохраняются<br>после отправки формы.</p></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>Управление ассортиментом</span><span class="workspace-badge">Каталог</span></header>
    <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer>Каталог товаров <span>Учебный проект · МФЮА</span></footer>
  </div>
</body>
</html>
