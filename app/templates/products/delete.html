{% extends 'base.html' %}
{% block title %}Удаление товара{% endblock %}
{% block content %}<a class="back-link" href="/products/{{ product.id }}">← К карточке товара</a><section class="card confirmation"><div class="eyebrow">ПОДТВЕРЖДЕНИЕ</div><h1>Удалить товар?</h1><p>«{{ product.name }}», артикул <strong>{{ product.sku }}</strong>, будет удалён из каталога. Отменить это действие нельзя.</p><form method="post" action="/products/{{ product.id }}/delete"><div class="form-actions"><button class="button button-danger" type="submit">Удалить товар</button><a class="button button-secondary" href="/products/{{ product.id }}">Отмена</a></div></form></section>{% endblock %}
